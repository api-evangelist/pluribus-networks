name: Pluribus Networks
description: 'Pluribus Networks was a software-defined networking (SDN) and open-networking
  vendor known for its NetVisor ONE network operating system (NVOS), the Adaptive Cloud
  Fabric controllerless SDN fabric, the UNUM management/analytics platform, and the Freedom
  9000 series switches. The company was acquired by Arista Networks in 2022; the
  pluribusnetworks.com domain now redirects to Arista''s Pluribus support resources, and the
  core Pluribus product line (NVOS, UNUM, Freedom 9000) has since been moved to End-of-Sale /
  End-of-Life. No independent Pluribus developer portal, public REST API, OpenAPI definition,
  or SDK is published; support and technical documentation are provided through the Arista
  customer portal. Originally surfaced as a portfolio company of DCVC and Menlo Ventures.'
